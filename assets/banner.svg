<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 180" width="100%" role="img" aria-label="Baurzhan — Mathematics, Scientific Computing, Machine Learning &amp; Systems">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#131924" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#30363d" stroke-width="0.6" stroke-opacity="0.45" />
    </pattern>
  </defs>

  <!-- Card background -->
  <rect width="880" height="180" rx="12" fill="url(#bg)" stroke="#30363d" stroke-width="1" />
  <rect width="880" height="180" rx="12" fill="url(#grid)" />

  <!-- Top accent bar -->
  <rect x="0" y="0" width="880" height="3" rx="1.5" fill="url(#accent)" />

  <!-- Geometric tensor / lattice motif on the right -->
  <g transform="translate(700, 32)" opacity="0.85">
    <polygon points="60,8 112,38 112,98 60,128 8,98 8,38" fill="none" stroke="#6366f1" stroke-width="1.4" stroke-opacity="0.7" />
    <polygon points="60,28 94,48 94,88 60,108 26,88 26,48" fill="none" stroke="#22c55e" stroke-width="1.2" stroke-opacity="0.6" />
    <line x1="60" y1="8" x2="60" y2="128" stroke="#30363d" stroke-width="1" />
    <line x1="8" y1="38" x2="112" y2="98" stroke="#30363d" stroke-width="1" />
    <line x1="112" y1="38" x2="8" y2="98" stroke="#30363d" stroke-width="1" />
    <circle cx="60" cy="68" r="4" fill="#22c55e" />
    <circle cx="60" cy="8" r="3" fill="#6366f1" />
    <circle cx="112" cy="38" r="3" fill="#6366f1" />
    <circle cx="112" cy="98" r="3" fill="#6366f1" />
    <circle cx="60" cy="128" r="3" fill="#6366f1" />
    <circle cx="8" cy="98" r="3" fill="#6366f1" />
    <circle cx="8" cy="38" r="3" fill="#6366f1" />
  </g>

  <!-- Monospace eyebrow -->
  <text x="44" y="54" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" letter-spacing="1.5">
    @BAUER1 · DATA SCIENTIST / ML ENGINEER
  </text>

  <!-- Name -->
  <text x="44" y="98" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="38" font-weight="700" letter-spacing="-0.5">
    Baurzhan
  </text>

  <!-- Tagline -->
  <text x="44" y="132" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400">
    Mathematics · Scientific Computing · Machine Learning &amp; Systems
  </text>

  <!-- Subtle accent underline -->
  <rect x="44" y="148" width="96" height="3" rx="1.5" fill="url(#accent)" />
</svg>
